<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gpRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="115" fill="url(#gpRed)" />
  
  <!-- Stylized Shield & Pause Symbol -->
  <g filter="url(#shadow)">
    <!-- Pause Bars representing the "Pause" in GamblePause -->
    <rect x="160" y="146" width="68" height="220" rx="34" fill="#FFFFFF" />
    <rect x="284" y="146" width="68" height="220" rx="34" fill="#FFFFFF" />
    <!-- Heart / Leaf Protection Accent at top -->
    <circle cx="256" cy="116" r="28" fill="#FEE2E2" />
  </g>
</svg>
